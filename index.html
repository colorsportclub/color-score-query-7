<!DOCTYPE html>

<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>成績查詢系統</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family:
        Arial,
        "Noto Sans TC",
        sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 10px auto;
      background: #ffffff;
      padding: 18px;
      border-radius: 14px;
      box-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 22px;
      font-size: 26px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 16px;
    }

    input,
    select {
      width: 100%;
      height: 45px;
      padding: 0 11px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 16px;
      background: #ffffff;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #1976d2;
    }

    select:disabled {
      background: #eeeeee;
      color: #999999;
    }

    button {
      width: 100%;
      height: 46px;
      margin-top: 3px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #125ca5;
    }

    button:disabled {
      background: #aaaaaa;
      cursor: not-allowed;
    }

    .result {
      margin-top: 25px;
    }

    .result-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    /*
    ==========================================
    手機版結果卡片
    ==========================================
    */

    .result-card {
      width: 100%;
      border: 1px solid #dddddd;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
      margin-bottom: 12px;
    }

    .result-row {
      display: flex;
      width: 100%;
      min-height: 44px;
      border-bottom: 1px solid #eeeeee;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-label {
      width: 32%;
      padding: 10px 8px;
      background: #f1f5f9;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
    }

    .result-value {
      width: 68%;
      padding: 10px 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      word-break: break-word;
    }

    .score {
      font-size: 18px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      padding: 18px 10px;
      color: #777777;
      font-size: 15px;
    }

    .loading {
      text-align: center;
      padding: 18px 10px;
      color: #1976d2;
      font-size: 15px;
    }

    .error {
      text-align: center;
      padding: 18px 10px;
      color: #d32f2f;
      font-size: 15px;
    }

    /*
    ==========================================
    電腦版
    ==========================================
    */

    @media (min-width: 700px) {

      body {
        padding: 20px;
      }

      .container {
        margin: 30px auto;
        padding: 30px;
      }

      h1 {
        font-size: 30px;
      }

      .result-row {
        min-height: 48px;
      }

      .result-label {
        width: 25%;
        padding: 12px;
        font-size: 15px;
      }

      .result-value {
        width: 75%;
        padding: 12px;
        font-size: 15px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

```

```

  </div>

  <script>

    // ==================================================
    // Google Apps Script
    // ==================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxH5g5d8vlbMjs6XxHK4JN634Kg7LuP7Bnmg-qjRnKKYVNNGDaz1s2a0gJE1RVY3uQ5/exec";


    // ==================================================
    // 網頁元件
    // ==================================================

    const classSelect =
      document.getElementById(
        "classSelect"
      );

    const nameInput =
      document.getElementById(
        "nameInput"
      );

    const itemSelect =
      document.getElementById(
        "itemSelect"
      );

    const searchButton =
      document.getElementById(
        "searchButton"
      );

    const resultArea =
      document.getElementById(
        "resultArea"
      );


    // ==================================================
    // 網頁載入
    // ==================================================

    window.addEventListener(
      "load",
      function() {

        loadClasses();

      }
    );


    // ==================================================
    // 載入班別
    // ==================================================

    function loadClasses() {

      classSelect.innerHTML =
        '<option value="">班別載入中...</option>';


      fetch(
        API_URL +
        "?action=classes"
      )

      .then(
        function(response) {

          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }

          return response.json();

        }
      )

      .then(
        function(data) {

          console.log(
            "班別資料：",
            data
          );


          if (
            !Array.isArray(data)
          ) {

            throw new Error(
              "班別資料格式錯誤"
            );

          }


          classSelect.innerHTML =
            '<option value="">請選擇班別</option>';


          data.forEach(
            function(className) {

              const option =
                document.createElement(
                  "option"
                );


              option.value =
                className;


              option.textContent =
                className;


              classSelect.appendChild(
                option
              );

            }
          );

        }
      )

      .catch(
        function(error) {

          console.error(
            "班別載入失敗：",
            error
          );


          classSelect.innerHTML =
            '<option value="">班別載入失敗</option>';


          resultArea.innerHTML =
            '<div class="error">班別載入失敗，請確認 Apps Script。</div>';

        }
      );

    }


    // ==================================================
    // 選擇班別
    // ==================================================

    classSelect.addEventListener(
      "change",
      function() {

        clearItems();

        nameInput.value = "";

        resultArea.innerHTML =
          '<div class="message">請輸入姓名</div>';

      }
    );


    // ==================================================
    // 姓名按 Enter
    // ==================================================

    nameInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          loadItems();

        }

      }
    );


    // ==================================================
    // 姓名離開輸入框
    // ==================================================

    nameInput.addEventListener(
      "blur",
      function() {

        loadItems();

      }
    );


    // ==================================================
    // 清除項目
    // ==================================================

    function clearItems() {

      itemSelect.innerHTML =
        '<option value="">請先選擇班別並輸入姓名</option>';


      itemSelect.disabled =
        true;

    }


    // ==================================================
    // 取得項目
    // ==================================================

    function loadItems() {

      const className =
        classSelect.value.trim();


      const name =
        nameInput.value.trim();


      if (
        className === ""
      ) {

        clearItems();

        return;

      }


      if (
        name === ""
      ) {

        clearItems();

        return;

      }


      itemSelect.disabled =
        true;


      itemSelect.innerHTML =
        '<option value="">項目載入中...</option>';


      const url =
        API_URL +
        "?action=items" +
        "&name=" +
        encodeURIComponent(
          name
        ) +
        "&className=" +
        encodeURIComponent(
          className
        );


      fetch(url)

        .then(
          function(response) {

            if (!response.ok) {

              throw new Error(
                "HTTP " +
                response.status
              );

            }

            return response.json();

          }
        )

        .then(
          function(data) {

            console.log(
              "項目資料：",
              data
            );


            if (
              !Array.isArray(data)
            ) {

              throw new Error(
                "項目資料格式錯誤"
              );

            }


            itemSelect.innerHTML =
              '<option value="">請選擇項目</option>';


            if (
              data.length === 0
            ) {

              itemSelect.innerHTML =
                '<option value="">查無此學生</option>';


              itemSelect.disabled =
                true;


              return;

            }


            data.forEach(
              function(item) {

                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  item;


                option.textContent =
                  item;


                itemSelect.appendChild(
                  option
                );

              }
            );


            itemSelect.disabled =
              false;

          }
        )

        .catch(
          function(error) {

            console.error(
              "項目載入失敗：",
              error
            );


            itemSelect.innerHTML =
              '<option value="">項目載入失敗</option>';


            itemSelect.disabled =
              true;

          }
        );

    }


    // ==================================================
    // 查詢按鈕
    // ==================================================

    searchButton.addEventListener(
      "click",
      function() {

        searchScore();

      }
    );


    // ==================================================
    // 查詢成績
    // ==================================================

    function searchScore() {

      const className =
        classSelect.value.trim();


      const name =
        nameInput.value.trim();


      const item =
        itemSelect.value.trim();


      if (
        className === ""
      ) {

        alert(
          "請選擇班別"
        );

        return;

      }


      if (
        name === ""
      ) {

        alert(
          "請輸入姓名"
        );

        nameInput.focus();

        return;

      }


      if (
        item === ""
      ) {

        alert(
          "請選擇項目"
        );

        return;

      }


      resultArea.innerHTML =
        '<div class="loading">查詢中...</div>';


      searchButton.disabled =
        true;


      const url =
        API_URL +
        "?name=" +
        encodeURIComponent(
          name
        ) +
        "&className=" +
        encodeURIComponent(
          className
        ) +
        "&item=" +
        encodeURIComponent(
          item
        );


      fetch(url)

        .then(
          function(response) {

            if (!response.ok) {

              throw new Error(
                "HTTP " +
                response.status
              );

            }

            return response.json();

          }
        )

        .then(
          function(data) {

            console.log(
              "查詢結果：",
              data
            );


            displayResults(
              data
            );

          }
        )

        .catch(
          function(error) {

            console.error(
              "查詢失敗：",
              error
            );


            resultArea.innerHTML =
              '<div class="error">查詢失敗，請稍後再試。</div>';

          }
        )

        .finally(
          function() {

            searchButton.disabled =
              false;

          }
        );

    }


    // ==================================================
    // 顯示結果
    // 手機版採用卡片
    // ==================================================

    function displayResults(data) {

      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        resultArea.innerHTML =
          '<div class="message">查無此項目的測驗成績</div>';

        return;

      }


      let html = "";


      data.forEach(
        function(row) {

          html +=
            '<div class="result-card">';


          // 測驗日期

          html +=
            '<div class="result-row">';

          html +=
            '<div class="result-label">測驗日期</div>';

          html +=
            '<div class="result-value">' +
            escapeHTML(
              formatDateOnly(
                row.testDate
              )
            ) +
            '</div>';

          html +=
            '</div>';


          // 教練

          html +=
            '<div class="result-row">';

          html +=
            '<div class="result-label">教練</div>';

          html +=
            '<div class="result-value">' +
            escapeHTML(
              row.coach || ""
            ) +
            '</div>';

          html +=
            '</div>';


          // 項目

          html +=
            '<div class="result-row">';

          html +=
            '<div class="result-label">項目</div>';

          html +=
            '<div class="result-value">' +
            escapeHTML(
              row.item || ""
            ) +
            '</div>';

          html +=
            '</div>';


          // 成績

          html +=
            '<div class="result-row">';

          html +=
            '<div class="result-label">成績</div>';

          html +=
            '<div class="result-value score">' +
            escapeHTML(
              String(
                row.score ?? ""
              )
            ) +
            '</div>';

          html +=
            '</div>';


          html +=
            '</div>';

        }
      );


      resultArea.innerHTML =
        html;

    }


    // ==================================================
    // 日期只保留 年/月/日
    // ==================================================

    function formatDateOnly(value) {

      if (
        !value
      ) {

        return "";

      }


      const text =
        String(value).trim();


      // 已經是 YYYY/MM/DD

      let match =
        text.match(
          /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
        );


      if (
        match
      ) {

        return (
          match[1] +
          "/" +
          ("0" + match[2]).slice(-2) +
          "/" +
          ("0" + match[3]).slice(-2)
        );

      }


      // 其他日期格式

      const date =
        new Date(text);


      if (
        !isNaN(
          date.getTime()
        )
      ) {

        const year =
          date.getFullYear();


        const month =
          String(
            date.getMonth() + 1
          ).padStart(
            2,
            "0"
          );


        const day =
          String(
            date.getDate()
          ).padStart(
            2,
            "0"
          );


        return (
          year +
          "/" +
          month +
          "/" +
          day
        );

      }


      return text;

    }


    // ==================================================
    // HTML 安全處理
    // ==================================================

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
